<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern AntConc</title>
    
    <style>
        /* Font Face Declaration - Make sure the path matches your folder structure */
        @font-face {
            font-family: 'JameelNoori';
            src: url('fonts/Jameel%20Noori%20Nastaleeq%20Regular.ttf') format('ttf'),
                url('fonts/Jameel%20Noori%20Nastaleeq%20Regular.ttf') format('ttf'),
                url('fonts/Jameel%20Noori%20Nastaleeq%20Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'JameelNoori', 'Noto Nastaliq Urdu', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .cloud-display,
        .list-word,
        .thermal-word,
        .kwic-col-left,
        .kwic-col-keyword,
        .kwic-col-right {
            direction: rtl;
            font-family: 'JameelNoori', 'Noto Nastaliq Urdu', serif;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }

        .header-info {
            display: flex;
            gap: 24px;
            font-size: 14px;
        }

        .header-info span {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
        }

        .main-nav {
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            padding: 0;
            display: flex;
            overflow-x: auto;
        }

        .nav-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #495057;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .nav-btn:hover {
            background: #e9ecef;
            color: #667eea;
        }

        .nav-btn.active {
            background: white;
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .chart-selector {
            margin-bottom: 24px;
            display: none;
        }

        .chart-selector.show {
            display: block;
        }

        .chart-selector-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
        }

        .chart-dropdown {
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            width: 300px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .chart-dropdown:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .content-area {
            padding: 32px;
            min-height: 500px;
        }

        .file-controls {
            background: #f8f9fa;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 2px dashed #dee2e6;
        }

        .file-input-wrapper {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .file-input-group {
            flex: 1;
            min-width: 300px;
        }

        .file-input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
        }

        .file-input {
            display: none;
        }

        .file-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .file-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .file-button:active {
            transform: translateY(0);
        }

        .file-button.clear-btn {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        .file-button.clear-btn:hover {
            box-shadow: 0 6px 16px rgba(220, 53, 69, 0.4);
        }

        .file-count {
            display: inline-block;
            padding: 6px 12px;
            background: #e7f3ff;
            color: #0066cc;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-input {
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .freq-input {
            padding: 12px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            width: 200px;
        }

        .search-btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .export-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.4);
        }

        .export-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-area {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            min-height: 400px;
            border: 1px solid #dee2e6;
        }

        .placeholder {
            text-align: center;
            color: #6c757d;
            padding: 60px 20px;
        }

        .placeholder-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .placeholder-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .placeholder-subtext {
            font-size: 14px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .search-controls {
                grid-template-columns: 1fr;
            }

            .freq-input {
                width: 100%;
            }

            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Modern AntConc</h1>
            <div class="header-info">
                <span id="totalFiles">Files: 0</span>
                <span id="totalTokens">Tokens: 0</span>
                <span id="totalHits">Hits: 0</span>
            </div>
        </div>

        <nav class="main-nav">
            <button class="nav-btn active" data-view="kwic">KWIC</button>
            <button class="nav-btn" data-view="plot">Plot</button>
            <button class="nav-btn" data-view="file-view">File View</button>
            <button class="nav-btn" data-view="cluster">Cluster</button>
            <button class="nav-btn active" data-view="n-gram">N-Gram</button>            
            <button class="nav-btn" data-view="collocate">Collocate</button>
            <button class="nav-btn" data-view="word">Word</button>
            <button class="nav-btn" data-view="keyword">Keyword</button>
            <button class="nav-btn" data-view="wordcloud">Wordcloud</button>
            <button class="nav-btn" data-view="bibliometrics">Bibliometrics</button>
            <button class="nav-btn" data-view="POS">POS</button>
            <button class="nav-btn" data-view="tokentype">Token/Type</button>
        </nav>

        <div class="content-area">
        <div class="file-controls">
            <div class="file-input-wrapper">
                <div class="file-input-group">
                    <label class="file-input-label">Select Corpus Files</label>
                    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                        <input type="file" id="fileInput" class="file-input" multiple accept=".txt,.xlsx,.xls,.csv">
                        
                        <label for="fileInput" class="file-button">
                            📁 Choose Files
                        </label>

                        <button class="file-button clear-btn" id="clearBtn" type="button">
                            🗑️ Clear Files
                        </button>

                        <span class="file-count" id="fileCount">No files selected</span>
                    </div>
                </div>
            </div>
        </div>

            <div class="search-controls">
                <input type="text" class="search-input" id="searchQuery" placeholder="Enter search term (optional for some modules)...">
                <input type="number" class="freq-input" id="minFreq" placeholder="Min. frequency" value="1" min="1">
                <button class="search-btn" id="searchBtn">🔍 Search</button>
                <button class="export-btn" id="exportBtn" disabled>📥 Export</button>
            </div>

            <div class="chart-selector" id="chartSelector">
                <label class="chart-selector-label">Select Chart Type</label>
                <select class="chart-dropdown" id="chartDropdown">
                    <option value="boxed">🟦 Boxed Chart</option>
                    <option value="bubble">⚪ Bubble Chart</option>
                </select>
            </div>

            <div class="chart-selector" id="posTagSelector">
                <label class="chart-selector-label">Filter by POS Tag</label>
                <select class="chart-dropdown" id="posTagDropdown">
                    <option value="all">All Tags</option>
                    <option value="NN">Noun (NN)</option>
                    <option value="PR">Pronoun (PR)</option>
                    <option value="VB">Verb (VB)</option>
                    <option value="ADJ">Adjective (ADJ)</option>
                    <option value="ADV">Adverb (ADV)</option>
                    <option value="P">Preposition (P)</option>
                    <option value="CC">Conjunction (CC)</option>
                    <option value="AUXA">Auxiliary (AUXA)</option>
                    <option value="TA">Tense Aspect (TA)</option>
                    <option value="KER">Verb Karna (KER)</option>
                    <option value="SE">Postposition SE (SE)</option>
                    <option value="CA">Case Marker (CA)</option>
                    <option value="MO">Modal (MO)</option>
                    <option value="Q">Quantifier (Q)</option>
                    <option value="INT">Intensifier (INT)</option>
                    <option value="WALA">Wala Suffix (WALA)</option>
                    <option value="NEG">Negation (NEG)</option>
                    <option value="SM">Sentence Marker (SM)</option>
                    <option value="RDP">Reduplication (RDP)</option>
                    <option value="DATE">Date (DATE)</option>
                    <option value="TIME">Time (TIME)</option>
                    <option value="NUM">Number (NUM)</option>
                    <option value="U">Unknown (U)</option>
                    <option value="SYM">Symbol (SYM)</option>
                    <option value="G">Foreign Word (G)</option>
                    <option value="PUNCT">Punctuation (PUNCT)</option>
                </select>
            </div>

            <div class="chart-selector" id="posTypeSelector">
                <label class="chart-selector-label">Filter by POS Type</label>
                <select class="chart-dropdown" id="posTypeDropdown">
                    <option value="all">All Types</option>
                </select>
            </div>

            <div class="results-area" id="resultsArea">
                <div class="placeholder">
                    <div class="placeholder-icon">📚</div>
                    <div class="placeholder-text">Welcome to Modern AntConc</div>
                    <div class="placeholder-subtext">Select files to begin analysis</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let selectedFiles = [];
        let currentView = 'kwic';
        let currentChart = 'boxed';
        let currentPOSTag = 'all';
        let currentPOSType = 'all';
        let currentResults = null;

        // Modules that don't require search query
        const NO_SEARCH_MODULES = ['n-gram', 'word', 'keyword', 'wordcloud', 'POS', 'bibliometrics', 'cluster', 'tokentype'];

        // File handling
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('fileCount');
        const clearBtn = document.getElementById('clearBtn');
        const searchBtn = document.getElementById('searchBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resultsArea = document.getElementById('resultsArea');
        const posTagSelector = document.getElementById('posTagSelector');
        const posTagDropdown = document.getElementById('posTagDropdown');
        const posTypeSelector = document.getElementById('posTypeSelector');
        const posTypeDropdown = document.getElementById('posTypeDropdown');

        // Clear button functionality
        clearBtn.addEventListener('click', () => {
            selectedFiles = [];
            fileInput.value = '';
            currentResults = null;
            exportBtn.disabled = true;
            updateFileCount();
            
            // Reset stats
            document.getElementById('totalFiles').textContent = 'Files: 0';
            document.getElementById('totalTokens').textContent = 'Tokens: 0';
            document.getElementById('totalHits').textContent = 'Hits: 0';
            
            // Show placeholder
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">📚</div>
                    <div class="placeholder-text">Welcome to Modern AntConc</div>
                    <div class="placeholder-subtext">Select files to begin analysis</div>
                </div>
            `;
        });

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            updateFileCount();
            
            // Automatically process based on current view
            if (selectedFiles.length > 0) {
                const query = document.getElementById('searchQuery').value;
                const minFreq = document.getElementById('minFreq').value;
                
                // For modules that don't need search query, process immediately
                if (NO_SEARCH_MODULES.includes(currentView)) {
                    performSearch(query, minFreq);
                } else if (query) {
                    // For modules that need search query, only process if query exists
                    performSearch(query, minFreq);
                }
            }
        });

        function updateFileCount() {
            const count = selectedFiles.length;
            fileCount.textContent = count === 0 ? 'No files selected' : `${count} file${count > 1 ? 's' : ''} selected`;
            document.getElementById('totalFiles').textContent = `Files: ${count}`;
        }

        // Navigation
        const navButtons = document.querySelectorAll('.nav-btn');
        const chartSelector = document.getElementById('chartSelector');
        const chartDropdown = document.getElementById('chartDropdown');

        navButtons.forEach(btn => {
            btn.addEventListener('click', async () => {
                navButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                currentView = btn.dataset.view;

                if (currentView === 'bibliometrics') {
                    chartSelector.classList.add('show');
                } else {
                    chartSelector.classList.remove('show');
                }

                if (currentView === 'POS') {
                    posTagSelector.classList.add('show');
                    posTypeSelector.classList.add('show');
                } else {
                    posTagSelector.classList.remove('show');
                    posTypeSelector.classList.remove('show');
                }

                // Auto-process if files are selected
                if (selectedFiles.length > 0) {
                    const query = document.getElementById('searchQuery').value;
                    const minFreq = document.getElementById('minFreq').value;
                    
                    // For modules that don't need search query, process immediately
                    if (NO_SEARCH_MODULES.includes(currentView)) {
                        performSearch(query, minFreq);
                    } else if (query) {
                        // For modules that need search query, only process if query exists
                        performSearch(query, minFreq);
                    } else {
                        updateView();
                    }
                } else {
                    updateView();
                }
            });
        });

        chartDropdown.addEventListener('change', (e) => {
            currentChart = e.target.value;
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;
            
            if (selectedFiles.length > 0) {
                performSearch(query, minFreq);
            }
        });

        posTagDropdown.addEventListener('change', (e) => {
            currentPOSTag = e.target.value;
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;
            
            if (selectedFiles.length > 0 && currentView === 'POS') {
                performSearch(query, minFreq);
            }
        });

        posTypeDropdown.addEventListener('change', (e) => {
            currentPOSType = e.target.value;
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;
            
            if (selectedFiles.length > 0 && currentView === 'POS') {
                performSearch(query, minFreq);
            }
        });

        // Export functionality
        exportBtn.addEventListener('click', () => {
            if (!currentResults) {
                alert('No results to export');
                return;
            }

            const exportFormat = prompt('Choose export format:\n1. CSV\n2. Excel\n3. JSON\n\nEnter 1, 2, or 3:', '1');
            
            if (exportFormat === '1') {
                exportToCSV(currentResults);
            } else if (exportFormat === '2') {
                exportToExcel(currentResults);
            } else if (exportFormat === '3') {
                exportToJSON(currentResults);
            }
        });

        searchBtn.addEventListener('click', () => {
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;

            // Allow search without query for certain modules
            if (!query && !NO_SEARCH_MODULES.includes(currentView)) {
                alert('Please enter a search term');
                return;
            }

            if (selectedFiles.length === 0) {
                alert('Please select at least one file');
                return;
            }

            performSearch(query, minFreq);
        });

        async function performSearch(query, minFreq) {
            const needsQuery = !NO_SEARCH_MODULES.includes(currentView);
            const displayQuery = query || 'all data';
            
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">⏳</div>
                    <div class="placeholder-text">Processing ${needsQuery && query ? `search for "${query}"` : currentView.toUpperCase()}...</div>
                    <div class="placeholder-subtext">${query ? `Minimum frequency: ${minFreq} | ` : ''}View: ${currentView.toUpperCase()}</div>
                </div>
            `;

            try {
                if (currentView === 'kwic') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">🔍</div>
                                <div class="placeholder-text">KWIC View</div>
                                <div class="placeholder-subtext">Enter a search term to see keyword in context results</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await kwicModule.processFiles(selectedFiles, query, minFreq);
                    kwicModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                    document.getElementById('totalTokens').textContent = `Tokens: ${data.totalTokens.toLocaleString()}`;
                } else if (currentView === 'plot') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">📊</div>
                                <div class="placeholder-text">Plot View</div>
                                <div class="placeholder-subtext">Enter a search term to see distribution plot</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await plotModule.processFiles(selectedFiles, query, minFreq);
                    plotModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                } else if (currentView === 'file-view') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">📄</div>
                                <div class="placeholder-text">File View</div>
                                <div class="placeholder-subtext">Enter a search term to see results by file</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await fileViewModule.processFiles(selectedFiles, query, minFreq);
                    fileViewModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                } else if (currentView === 'cluster') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">🔗</div>
                                <div class="placeholder-text">Cluster View</div>
                                <div class="placeholder-subtext">Enter a search term to see cluster analysis</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await clusterModule.processFiles(selectedFiles, query, minFreq);
                    clusterModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                } else if (currentView === 'collocate') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">🔤</div>
                                <div class="placeholder-text">Collocate View</div>
                                <div class="placeholder-subtext">Enter a search term to see collocations</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await collocateModule.processFiles(selectedFiles, query, minFreq, 5);
                    collocateModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'wordcloud') {
                    const data = await wordCloudModule.processFiles(selectedFiles, query, minFreq);
                    wordCloudModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'word') {
                    const data = await wordModule.processFiles(selectedFiles, query, minFreq);
                    wordModule.renderWordList(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'keyword') {
                    const data = await wordModule.processFiles(selectedFiles, query, minFreq);
                    wordModule.renderWordList(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'n-gram') {
                    const data = await ngramModule.init(selectedFiles);   
                    ngramModule.render(resultsArea, data);
                } else if (currentView === 'POS') {
                    const data = await posModule.processFiles(selectedFiles, query, minFreq, currentPOSTag, currentPOSType);
                    
                    // Populate POS type dropdown with unique types
                    if (data.success && data.results) {
                        const uniqueTypes = [...new Set(data.results.map(r => r.pos_type).filter(t => t))];
                        posTypeDropdown.innerHTML = '<option value="all">All Types</option>';
                        uniqueTypes.sort().forEach(type => {
                            posTypeDropdown.innerHTML += `<option value="${type}">${type}</option>`;
                        });
                        if (currentPOSType !== 'all') {
                            posTypeDropdown.value = currentPOSType;
                        }
                    }
                    
                    posModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    const displayCount = data.results ? (query || currentPOSTag !== 'all' || currentPOSType !== 'all' ? data.results.filter(r => {
                        const matchesQuery = !query || r.word.toLowerCase().includes(query.toLowerCase()) ||
                            (r.pos || '').toLowerCase().includes(query.toLowerCase()) ||
                            (r.pos_type || '').toLowerCase().includes(query.toLowerCase());
                        const matchesTag = currentPOSTag === 'all' || (r.pos || '').toUpperCase() === currentPOSTag.toUpperCase();
                        const matchesType = currentPOSType === 'all' || (r.pos_type || '') === currentPOSType;
                        return matchesQuery && matchesTag && matchesType;
                    }).length : data.results.length) : 0;
                    document.getElementById('totalHits').textContent = `Words: ${displayCount}`;
                } else if (currentView === 'bibliometrics') {
                    const data = await bibliometricsModule.processFiles(selectedFiles, query, minFreq, currentChart);
                    bibliometricsModule.render(resultsArea, data, currentChart);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'tokentype') {
                    const data = await tokenTypeModule.processFiles(selectedFiles, query, minFreq);
                    tokenTypeModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Types: ${data.statistics?.totalTypes || 0}`;
                    document.getElementById('totalTokens').textContent = `Tokens: ${data.statistics?.totalTokens?.toLocaleString() || 0}`;
                } else {
                    loadView(currentView, query, minFreq);
                    exportBtn.disabled = true;
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsArea.innerHTML = `
                    <div class="placeholder">
                        <div class="placeholder-icon">❌</div>
                        <div class="placeholder-text">Error processing search</div>
                        <div class="placeholder-subtext">${error.message}</div>
                    </div>
                `;
            }
        }

        function updateView() {
            const needsSearch = !NO_SEARCH_MODULES.includes(currentView);
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">📊</div>
                    <div class="placeholder-text">${currentView.toUpperCase()} View${currentView === 'bibliometrics' ? ` - ${currentChart}` : ''}</div>
                    <div class="placeholder-subtext">${needsSearch ? 'Enter a search term and click Search to see results' : 'Select files to begin analysis'}</div>
                </div>
            `;
        }

        function loadView(viewName, query, minFreq) {
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">🚧</div>
                    <div class="placeholder-text">${viewName.toUpperCase()} View</div>
                    <div class="placeholder-subtext">This module is under development</div>
                </div>
            `;
        }
        
        // Export functions
        function exportToCSV(data) {
            let csvContent = '';
            
            if (currentView === 'POS' && data.results) {
                // POS export
                csvContent = 'Index,Before,Word,After,POS,Type,Frequency,Percentage\n';
                const filteredResults = posModule.filterResults(data.results, data.query, data.minFreq, data.posTag, data.posType);
                filteredResults.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.before || '-'}","${item.word}","${item.after || '-'}","${item.pos}","${item.pos_type || '-'}",${item.frequency || 1},"${item.percentage || '0%'}"\n`;
                });
            } else if (currentView === 'tokentype' && data.results) {
                // Token/Type export
                csvContent = 'Rank,Word,POS,Type,Frequency,Percentage,Category\n';
                data.results.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.word}","${item.pos}","${item.pos_type || '-'}",${item.frequency},"${item.percentage}","${item.typeCategory}"\n`;
                });
            } else if (currentView === 'kwic' && data.results) {
                // KWIC export
                csvContent = 'File,Left Context,Keyword,Right Context\n';
                data.results.forEach(item => {
                    csvContent += `"${item.file}","${item.left}","${item.keyword}","${item.right}"\n`;
                });
            } else if (currentView === 'word' || currentView === 'keyword') {
                // Word list export
                csvContent = 'Rank,Word,Frequency,Percentage\n';
                data.words?.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.word}",${item.freq},"${item.percentage}"\n`;
                });
            } else if (currentView === 'n-gram' && data.ngrams) {
                // N-gram export
                csvContent = 'Rank,N-Gram,Frequency\n';
                data.ngrams.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.ngram}",${item.count}\n`;
                });
            } else {
                alert('Export not supported for this view yet');
                return;
            }
            
            downloadFile(csvContent, `${currentView}_results.csv`, 'text/csv');
        }
        
        function exportToExcel(data) {
            let worksheetData = [];
            
            if (currentView === 'POS' && data.results) {
                const filteredResults = posModule.filterResults(data.results, data.query, data.minFreq, data.posTag, data.posType);
                worksheetData = [
                    ['Index', 'Before', 'Word', 'After', 'POS', 'Type', 'Frequency', 'Percentage'],
                    ...filteredResults.map((item, index) => [
                        index + 1,
                        item.before || '-',
                        item.word,
                        item.after || '-',
                        item.pos,
                        item.pos_type || '-',
                        item.frequency || 1,
                        item.percentage || '0%'
                    ])
                ];
            } else if (currentView === 'tokentype' && data.results) {
                worksheetData = [
                    ['Rank', 'Word', 'POS', 'Type', 'Frequency', 'Percentage', 'Category'],
                    ...data.results.map((item, index) => [
                        index + 1,
                        item.word,
                        item.pos,
                        item.pos_type || '-',
                        item.frequency,
                        item.percentage,
                        item.typeCategory
                    ])
                ];
            } else if (currentView === 'kwic' && data.results) {
                worksheetData = [
                    ['File', 'Left Context', 'Keyword', 'Right Context'],
                    ...data.results.map(item => [item.file, item.left, item.keyword, item.right])
                ];
            } else if (currentView === 'word' || currentView === 'keyword') {
                worksheetData = [
                    ['Rank', 'Word', 'Frequency', 'Percentage'],
                    ...(data.words || []).map((item, index) => [index + 1, item.word, item.freq, item.percentage])
                ];
            } else if (currentView === 'n-gram' && data.ngrams) {
                worksheetData = [
                    ['Rank', 'N-Gram', 'Frequency'],
                    ...data.ngrams.map((item, index) => [index + 1, item.ngram, item.count])
                ];
            } else {
                alert('Export not supported for this view yet');
                return;
            }
            
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            XLSX.utils.book_append_sheet(wb, ws, currentView.toUpperCase());
            XLSX.writeFile(wb, `${currentView}_results.xlsx`);
        }
        
        function exportToJSON(data) {
            let exportData = {};
            
            if (currentView === 'POS' && data.results) {
                const filteredResults = posModule.filterResults(data.results, data.query, data.minFreq, data.posTag, data.posType);
                exportData = {
                    view: 'POS',
                    query: data.query,
                    posTag: data.posTag,
                    posType: data.posType,
                    minFreq: data.minFreq,
                    totalResults: filteredResults.length,
                    results: filteredResults
                };
            } else {
                exportData = {
                    view: currentView,
                    data: data
                };
            }
            
            const jsonStr = JSON.stringify(exportData, null, 2);
            downloadFile(jsonStr, `${currentView}_results.json`, 'application/json');
        }
        
        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>

    <script>
        // Global state
        let selectedFiles = [];
        let currentView = 'kwic';
        let currentChart = 'boxed';
        let currentPOSTag = 'all';
        let currentPOSType = 'all';
        let currentResults = null;

        // Modules that don't require search query
        const NO_SEARCH_MODULES = ['n-gram', 'word', 'keyword', 'wordcloud', 'POS', 'bibliometrics', 'tokentype'];

        // File handling
        const fileInput = document.getElementById('fileInput');
        const fileCount = document.getElementById('fileCount');
        const clearBtn = document.getElementById('clearBtn');
        const searchBtn = document.getElementById('searchBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resultsArea = document.getElementById('resultsArea');
        const posTagSelector = document.getElementById('posTagSelector');
        const posTagDropdown = document.getElementById('posTagDropdown');
        const posTypeSelector = document.getElementById('posTypeSelector');
        const posTypeDropdown = document.getElementById('posTypeDropdown');

        // Clear button functionality
        clearBtn.addEventListener('click', () => {
            selectedFiles = [];
            fileInput.value = '';
            currentResults = null;
            exportBtn.disabled = true;
            updateFileCount();
            
            // Reset stats
            document.getElementById('totalFiles').textContent = 'Files: 0';
            document.getElementById('totalTokens').textContent = 'Tokens: 0';
            document.getElementById('totalHits').textContent = 'Hits: 0';
            
            // Show placeholder
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">📚</div>
                    <div class="placeholder-text">Welcome to Modern AntConc</div>
                    <div class="placeholder-subtext">Select files to begin analysis</div>
                </div>
            `;
        });

        fileInput.addEventListener('change', (e) => {
            selectedFiles = Array.from(e.target.files);
            updateFileCount();
            
            // Automatically process based on current view
            if (selectedFiles.length > 0) {
                const query = document.getElementById('searchQuery').value;
                const minFreq = document.getElementById('minFreq').value;
                
                // For modules that don't need search query, process immediately
                if (NO_SEARCH_MODULES.includes(currentView)) {
                    performSearch(query, minFreq);
                } else if (query) {
                    // For modules that need search query, only process if query exists
                    performSearch(query, minFreq);
                }
            }
        });

        function updateFileCount() {
            const count = selectedFiles.length;
            fileCount.textContent = count === 0 ? 'No files selected' : `${count} file${count > 1 ? 's' : ''} selected`;
            document.getElementById('totalFiles').textContent = `Files: ${count}`;
        }

        // Navigation
        const navButtons = document.querySelectorAll('.nav-btn');
        const chartSelector = document.getElementById('chartSelector');
        const chartDropdown = document.getElementById('chartDropdown');

        navButtons.forEach(btn => {
            btn.addEventListener('click', async () => {
                navButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                currentView = btn.dataset.view;

                if (currentView === 'bibliometrics') {
                    chartSelector.classList.add('show');
                } else {
                    chartSelector.classList.remove('show');
                }

                if (currentView === 'POS') {
                    posTagSelector.classList.add('show');
                    posTypeSelector.classList.add('show');
                } else {
                    posTagSelector.classList.remove('show');
                    posTypeSelector.classList.remove('show');
                }

                // Auto-process if files are selected
                if (selectedFiles.length > 0) {
                    const query = document.getElementById('searchQuery').value;
                    const minFreq = document.getElementById('minFreq').value;
                    
                    // For modules that don't need search query, process immediately
                    if (NO_SEARCH_MODULES.includes(currentView)) {
                        performSearch(query, minFreq);
                    } else if (query) {
                        // For modules that need search query, only process if query exists
                        performSearch(query, minFreq);
                    } else {
                        updateView();
                    }
                } else {
                    updateView();
                }
            });
        });

        chartDropdown.addEventListener('change', (e) => {
            currentChart = e.target.value;
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;
            
            if (selectedFiles.length > 0) {
                performSearch(query, minFreq);
            }
        });

        posTagDropdown.addEventListener('change', (e) => {
            currentPOSTag = e.target.value;
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;
            
            if (selectedFiles.length > 0 && currentView === 'POS') {
                performSearch(query, minFreq);
            }
        });

        posTypeDropdown.addEventListener('change', (e) => {
            currentPOSType = e.target.value;
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;
            
            if (selectedFiles.length > 0 && currentView === 'POS') {
                performSearch(query, minFreq);
            }
        });

        // Export functionality
        exportBtn.addEventListener('click', () => {
            if (!currentResults) {
                alert('No results to export');
                return;
            }

            const exportFormat = prompt('Choose export format:\n1. CSV\n2. Excel\n3. JSON\n\nEnter 1, 2, or 3:', '1');
            
            if (exportFormat === '1') {
                exportToCSV(currentResults);
            } else if (exportFormat === '2') {
                exportToExcel(currentResults);
            } else if (exportFormat === '3') {
                exportToJSON(currentResults);
            }
        });

        searchBtn.addEventListener('click', () => {
            const query = document.getElementById('searchQuery').value;
            const minFreq = document.getElementById('minFreq').value;

            // Allow search without query for certain modules
            if (!query && !NO_SEARCH_MODULES.includes(currentView)) {
                alert('Please enter a search term');
                return;
            }

            if (selectedFiles.length === 0) {
                alert('Please select at least one file');
                return;
            }

            performSearch(query, minFreq);
        });

        async function performSearch(query, minFreq) {
            const needsQuery = !NO_SEARCH_MODULES.includes(currentView);
            const displayQuery = query || 'all data';
            
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">⏳</div>
                    <div class="placeholder-text">Processing ${needsQuery && query ? `search for "${query}"` : currentView.toUpperCase()}...</div>
                    <div class="placeholder-subtext">${query ? `Minimum frequency: ${minFreq} | ` : ''}View: ${currentView.toUpperCase()}</div>
                </div>
            `;

            try {
                if (currentView === 'kwic') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">🔍</div>
                                <div class="placeholder-text">KWIC View</div>
                                <div class="placeholder-subtext">Enter a search term to see keyword in context results</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await kwicModule.processFiles(selectedFiles, query, minFreq);
                    kwicModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                    document.getElementById('totalTokens').textContent = `Tokens: ${data.totalTokens.toLocaleString()}`;
                } else if (currentView === 'plot') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">📊</div>
                                <div class="placeholder-text">Plot View</div>
                                <div class="placeholder-subtext">Enter a search term to see distribution plot</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await plotModule.processFiles(selectedFiles, query, minFreq);
                    plotModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                } else if (currentView === 'file-view') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">📄</div>
                                <div class="placeholder-text">File View</div>
                                <div class="placeholder-subtext">Enter a search term to see results by file</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await fileViewModule.processFiles(selectedFiles, query, minFreq);
                    fileViewModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                } else if (currentView === 'cluster') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">🔗</div>
                                <div class="placeholder-text">Cluster View</div>
                                <div class="placeholder-subtext">Enter a search term to see cluster analysis</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await clusterModule.processFiles(selectedFiles, query, minFreq);
                    clusterModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Hits: ${data.totalHits}`;
                } else if (currentView === 'collocate') {
                    if (!query) {
                        resultsArea.innerHTML = `
                            <div class="placeholder">
                                <div class="placeholder-icon">🔤</div>
                                <div class="placeholder-text">Collocate View</div>
                                <div class="placeholder-subtext">Enter a search term to see collocations</div>
                            </div>
                        `;
                        exportBtn.disabled = true;
                        return;
                    }
                    const data = await collocateModule.processFiles(selectedFiles, query, minFreq, 5);
                    collocateModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'wordcloud') {
                    const data = await wordCloudModule.processFiles(selectedFiles, query, minFreq);
                    wordCloudModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'word') {
                    const data = await wordModule.processFiles(selectedFiles, query, minFreq);
                    wordModule.renderWordList(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'keyword') {
                    const data = await wordModule.processFiles(selectedFiles, query, minFreq);
                    wordModule.renderWordList(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'n-gram') {
                    const data = await ngramModule.init(selectedFiles);   
                    ngramModule.render(resultsArea, data);
                } else if (currentView === 'POS') {
                    const data = await posModule.processFiles(selectedFiles, query, minFreq, currentPOSTag, currentPOSType);
                    
                    // Populate POS type dropdown with unique types
                    if (data.success && data.results) {
                        const uniqueTypes = [...new Set(data.results.map(r => r.pos_type).filter(t => t))];
                        posTypeDropdown.innerHTML = '<option value="all">All Types</option>';
                        uniqueTypes.sort().forEach(type => {
                            posTypeDropdown.innerHTML += `<option value="${type}">${type}</option>`;
                        });
                        if (currentPOSType !== 'all') {
                            posTypeDropdown.value = currentPOSType;
                        }
                    }
                    
                    posModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    const displayCount = data.results ? (query || currentPOSTag !== 'all' || currentPOSType !== 'all' ? data.results.filter(r => {
                        const matchesQuery = !query || r.word.toLowerCase().includes(query.toLowerCase()) ||
                            (r.pos || '').toLowerCase().includes(query.toLowerCase()) ||
                            (r.pos_type || '').toLowerCase().includes(query.toLowerCase());
                        const matchesTag = currentPOSTag === 'all' || (r.pos || '').toUpperCase() === currentPOSTag.toUpperCase();
                        const matchesType = currentPOSType === 'all' || (r.pos_type || '') === currentPOSType;
                        return matchesQuery && matchesTag && matchesType;
                    }).length : data.results.length) : 0;
                    document.getElementById('totalHits').textContent = `Words: ${displayCount}`;
                } else if (currentView === 'bibliometrics') {
                    const data = await bibliometricsModule.processFiles(selectedFiles, query, minFreq, currentChart);
                    bibliometricsModule.render(resultsArea, data, currentChart);
                    currentResults = data;
                    exportBtn.disabled = false;
                } else if (currentView === 'tokentype') {
                    const data = await tokenTypeModule.processFiles(selectedFiles, query, minFreq);
                    tokenTypeModule.render(resultsArea, data);
                    currentResults = data;
                    exportBtn.disabled = false;
                    document.getElementById('totalHits').textContent = `Types: ${data.statistics?.totalTypes || 0}`;
                    document.getElementById('totalTokens').textContent = `Tokens: ${data.statistics?.totalTokens?.toLocaleString() || 0}`;
                } else {
                    loadView(currentView, query, minFreq);
                    exportBtn.disabled = true;
                }
            } catch (error) {
                console.error('Search error:', error);
                resultsArea.innerHTML = `
                    <div class="placeholder">
                        <div class="placeholder-icon">❌</div>
                        <div class="placeholder-text">Error processing search</div>
                        <div class="placeholder-subtext">${error.message}</div>
                    </div>
                `;
            }
        }

        function updateView() {
            const needsSearch = !NO_SEARCH_MODULES.includes(currentView);
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">📊</div>
                    <div class="placeholder-text">${currentView.toUpperCase()} View${currentView === 'bibliometrics' ? ` - ${currentChart}` : ''}</div>
                    <div class="placeholder-subtext">${needsSearch ? 'Enter a search term and click Search to see results' : 'Select files to begin analysis'}</div>
                </div>
            `;
        }

        function loadView(viewName, query, minFreq) {
            resultsArea.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-icon">🚧</div>
                    <div class="placeholder-text">${viewName.toUpperCase()} View</div>
                    <div class="placeholder-subtext">This module is under development</div>
                </div>
            `;
        }
        
        // Export functions
        function exportToCSV(data) {
            let csvContent = '';
            
            if (currentView === 'POS' && data.results) {
                // POS export
                csvContent = 'Index,Before,Word,After,POS,Type,Frequency,Percentage\n';
                const filteredResults = posModule.filterResults(data.results, data.query, data.minFreq, data.posTag, data.posType);
                filteredResults.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.before || '-'}","${item.word}","${item.after || '-'}","${item.pos}","${item.pos_type || '-'}",${item.frequency || 1},"${item.percentage || '0%'}"\n`;
                });
            } else if (currentView === 'tokentype' && data.results) {
                // Token/Type export
                csvContent = 'Rank,Word,POS,Type,Frequency,Percentage,Category\n';
                data.results.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.word}","${item.pos}","${item.pos_type || '-'}",${item.frequency},"${item.percentage}","${item.typeCategory}"\n`;
                });
            } else if (currentView === 'kwic' && data.results) {
                // KWIC export
                csvContent = 'File,Left Context,Keyword,Right Context\n';
                data.results.forEach(item => {
                    csvContent += `"${item.file}","${item.left}","${item.keyword}","${item.right}"\n`;
                });
            } else if (currentView === 'word' || currentView === 'keyword') {
                // Word list export
                csvContent = 'Rank,Word,Frequency,Percentage\n';
                data.words?.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.word}",${item.freq},"${item.percentage}"\n`;
                });
            } else if (currentView === 'n-gram' && data.ngrams) {
                // N-gram export
                csvContent = 'Rank,N-Gram,Frequency\n';
                data.ngrams.forEach((item, index) => {
                    csvContent += `${index + 1},"${item.ngram}",${item.count}\n`;
                });
            } else {
                alert('Export not supported for this view yet');
                return;
            }
            
            downloadFile(csvContent, `${currentView}_results.csv`, 'text/csv');
        }
        
        function exportToExcel(data) {
            let worksheetData = [];
            
            if (currentView === 'POS' && data.results) {
                const filteredResults = posModule.filterResults(data.results, data.query, data.minFreq, data.posTag, data.posType);
                worksheetData = [
                    ['Index', 'Before', 'Word', 'After', 'POS', 'Type', 'Frequency', 'Percentage'],
                    ...filteredResults.map((item, index) => [
                        index + 1,
                        item.before || '-',
                        item.word,
                        item.after || '-',
                        item.pos,
                        item.pos_type || '-',
                        item.frequency || 1,
                        item.percentage || '0%'
                    ])
                ];
            } else if (currentView === 'tokentype' && data.results) {
                worksheetData = [
                    ['Rank', 'Word', 'POS', 'Type', 'Frequency', 'Percentage', 'Category'],
                    ...data.results.map((item, index) => [
                        index + 1,
                        item.word,
                        item.pos,
                        item.pos_type || '-',
                        item.frequency,
                        item.percentage,
                        item.typeCategory
                    ])
                ];
            } else if (currentView === 'kwic' && data.results) {
                worksheetData = [
                    ['File', 'Left Context', 'Keyword', 'Right Context'],
                    ...data.results.map(item => [item.file, item.left, item.keyword, item.right])
                ];
            } else if (currentView === 'word' || currentView === 'keyword') {
                worksheetData = [
                    ['Rank', 'Word', 'Frequency', 'Percentage'],
                    ...(data.words || []).map((item, index) => [index + 1, item.word, item.freq, item.percentage])
                ];
            } else if (currentView === 'n-gram' && data.ngrams) {
                worksheetData = [
                    ['Rank', 'N-Gram', 'Frequency'],
                    ...data.ngrams.map((item, index) => [index + 1, item.ngram, item.count])
                ];
            } else {
                alert('Export not supported for this view yet');
                return;
            }
            
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            XLSX.utils.book_append_sheet(wb, ws, currentView.toUpperCase());
            XLSX.writeFile(wb, `${currentView}_results.xlsx`);
        }
        
        function exportToJSON(data) {
            let exportData = {};
            
            if (currentView === 'POS' && data.results) {
                const filteredResults = posModule.filterResults(data.results, data.query, data.minFreq, data.posTag, data.posType);
                exportData = {
                    view: 'POS',
                    query: data.query,
                    posTag: data.posTag,
                    posType: data.posType,
                    minFreq: data.minFreq,
                    totalResults: filteredResults.length,
                    results: filteredResults
                };
            } else {
                exportData = {
                    view: currentView,
                    data: data
                };
            }
            
            const jsonStr = JSON.stringify(exportData, null, 2);
            downloadFile(jsonStr, `${currentView}_results.json`, 'application/json');
        }
        
        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
